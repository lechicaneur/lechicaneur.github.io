name: Génération quotidienne d'investigation (Gemini)

on:
  schedule:
    # Exécution tous les jours à 07:00 du matin (UTC)
    - cron: '0 7 * * *'
  workflow_dispatch: # Permet de lancer le test manuellement depuis l'onglet Actions de GitHub

permissions:
  contents: write

jobs:
  publier-dossier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer l'environnement Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances (SDK Gemini)
        run: |
          pip install google-genai

      - name: Exécuter le script de génération autonome
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generer_dossier.py

      - name: Configurer l'identité Git pour le bot
        run: |
          git config --global user.name "Le Chicaneur (Bot IA)"
          git config --global user.email "bot@lechicaneur.github.io"

      - name: Enregistrer et pousser le nouveau dossier sur GitHub
        run: |
          git add _posts/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated: Nouveau dossier d'investigation quotidien par Gemini" && git push)