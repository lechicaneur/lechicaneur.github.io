<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Génère titre, meta description, canonical, Open Graph, Twitter Cards et JSON-LD -->
    {% seo %}
    
    <link rel="icon" type="image/png" href="{{ '/assets/images/favicon.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/layout.css' | relative_url }}">
</head>
<body>
    <header class="site-header-container">
        <div class="brand-wrapper">
            <a href="{{ '/' | relative_url }}" class="logo-link">
                <img src="{{ '/assets/images/favicon.png' | relative_url }}" alt="{{ site.title }}" class="site-logo" width="40" height="40">
            </a>
            <div class="brand-text">
                {% if page.url == "/" %}
                    <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
                {% else %}
                    <p class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></p>
                {% endif %}
            </div>
        </div>
        <p class="tagline">{{ site.description }}</p>
        <nav aria-label="Navigation principale">
            <a href="{{ '/' | relative_url }}">Archives & Dossiers</a>
            <a href="{{ '/a-propos' | relative_url }}">Ligne éditoriale</a>
        </nav>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Rechercher dans les archives (ex: ballast, audit...)" aria-label="Rechercher un dossier">
        </div>
    </header>
    <main>
        <div id="search-results"></div>
        <div id="main-feed">
            {{ content }}
        </div>
    </main>
    <footer>
        Rédaction centrale • Paris — Tous droits de reproduction et d'investigation réservés.
    </footer>
    <script src="{{ '/assets/js/search.js' | relative_url }}" defer></script>
</body>
</html>
